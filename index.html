<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Folder Sync</title>
<style>
:root{--bg:#000432;--panel:#000432;--line:#2c313b;--tx:#e8eaee;--mut:#8f97a6;--ok:#4fd1a1;--warn:#f2b84b;--err:#ff7b7b;--up:#7db4ff;--btn:#000432}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;gap:10px;padding:12px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-size:18px;margin:0;font-weight:650;letter-spacing:.2px}
.pill{display:inline-flex;align-items:center;gap:8px;padding:5px 12px;border:1px solid var(--line);border-radius:999px;background:var(--panel);font-weight:600}
.pill i{width:9px;height:9px;border-radius:50%;background:var(--mut)}
.pill[data-s=synced] i{background:var(--ok)}
.pill[data-s=syncing] i{background:var(--up)}
.pill[data-s=error] i{background:var(--err)}
.pill[data-s=paused] i{background:var(--warn)}
.proj{display:flex;gap:6px}
.proj button{border-radius:999px;padding:5px 14px;color:var(--mut)}
.proj button.on{color:var(--tx);border-color:var(--up);font-weight:650}
#done{display:none;padding:10px 14px;border:1px solid var(--ok);border-radius:8px;color:var(--ok);font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button{font:inherit;color:var(--tx);background:var(--btn);border:1px solid var(--line);border-radius:7px;padding:7px 12px;cursor:pointer}
button:hover{border-color:var(--mut)}
button:focus-visible{outline:2px solid var(--up);outline-offset:2px}
button.main{background:var(--bg);border-color:#2f5fb3;font-weight:600}
button.danger{color:var(--err)}
.sp{flex:1}
h1,#info,#done,#bPick,#bResume,#bNow,#bPause,#bTest,#bList,#bReset,.sp{display:none!important}
button.ic{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;padding:0}
button.ic svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#info{color:var(--mut);font-size:13px}
#log{flex:1;min-height:200px;overflow:auto;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:12px/1.5 ui-monospace,Consolas,monospace;white-space:pre-wrap;word-break:break-all}
#log div{color:#c5cad4}
#log .net{color:var(--mut)}
#log .up{color:var(--up)}
#log .down,#log .ok{color:var(--ok)}
#log .warn{color:var(--warn)}
#log .err{color:var(--err)}
#keep{display:none;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 12px;border:1px solid var(--warn);border-radius:8px;color:var(--warn);font-size:13px}
#keep span{flex:1;min-width:200px}
#panes{flex:1 1 0;min-height:200px;display:flex;gap:10px}
#log{flex:1 1 0;min-width:0;min-height:0}
#tree{flex:1 1 0;min-width:0;min-height:0;overflow:auto;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:13px/1.6 ui-monospace,Consolas,monospace}
#tree .th{color:var(--mut);font-size:12px;padding-bottom:6px;margin-bottom:4px;border-bottom:1px solid var(--line)}
#tree .te{color:var(--mut)}
#tree summary{cursor:pointer;color:var(--tx);padding:1px 0}
#tree details>*:not(summary){margin-left:16px}
#tree .tf{display:flex;align-items:center;gap:8px;color:#c5cad4}
#tree .tf i{width:8px;height:8px;border-radius:50%;flex:none;background:var(--mut)}
#tree .tf span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#tree .tf em{font-style:normal;color:var(--mut);font-size:12px}
#tree .ok i{background:var(--ok)}
#tree .tf span{cursor:pointer}
#tree .tf span:hover{text-decoration:underline}
#tree .tf button.del{flex:none;width:22px;height:22px;padding:0;line-height:1;font-size:12px;background:transparent;border-color:transparent;color:var(--mut)}
#tree .tf button.del:hover{color:var(--err);border-color:var(--err)}
#tree .loc i{background:var(--up)}
#tree .cld i{background:var(--warn)}
#tree .diff i{background:var(--err)}
@media(max-width:700px){#panes{flex-direction:column}}
.row:not(:has(#bSysn)){display:none}
#panes{order:50}
#bOpen{display:none!important}
.row:has(#bSysn){order:100;justify-content:space-around;gap:0;padding:8px 12px;background:var(--panel);border:1px solid var(--line);border-radius:12px}
.row:has(#bSysn) button.ic{width:46px;height:46px}
.row:has(#bSysn) button.ic svg{width:22px;height:22px}
#bPE{color:#c792ea;border-color:#c792ea}
#bSysn{color:#4fd1a1;border-color:#4fd1a1}
#bZip{color:#7db4ff;border-color:#7db4ff}
#bRepo{color:#f2b84b;border-color:#f2b84b}
#bBig{color:#ff8a5b;border-color:#ff8a5b}
#bRestore{color:#ff5d73;border-color:#ff5d73}
#bMaster{color:#2ee6d6;border-color:#2ee6d6}
#bCopy{color:#b8e986;border-color:#b8e986}
#bClear{color:#f78fb3;border-color:#f78fb3}
#bKeepSite{color:#7db4ff;border-color:#7db4ff}
#bKeepLink{color:#c792ea;border-color:#c792ea}
#bKeepX{color:#ff5d73;border-color:#ff5d73}
button.ic:hover,#bPE:hover{filter:brightness(1.3)}
#bZip,#bRepo{display:none!important}
#logbox{position:relative;flex:1 1 0;min-width:0;min-height:0;display:flex}
#logbox #log{padding-right:54px;border-color:#2f5fb3;border-radius:14px}
#logbox #bCopy{position:absolute;top:10px;right:24px;z-index:2;border-radius:10px}
#tree{border-color:#5a3fa0;border-radius:14px}
#log,#tree{scrollbar-width:thin;scrollbar-color:#2f5fb3 transparent}
#tree .tf{padding:2px 6px;border-radius:6px}
#tree .tf:hover{background:rgba(125,180,255,.1)}
.pill{box-shadow:0 0 16px rgba(125,180,255,.18)}
.pill[data-s=synced]{border-color:var(--ok)}
.pill[data-s=syncing]{border-color:var(--up)}
.pill[data-s=error]{border-color:var(--err)}
.pill[data-s=paused]{border-color:var(--warn)}
#keep{border-radius:14px}
button.ic{transition:transform .15s,filter .15s}
button.ic:hover{transform:translateY(-2px)}
.row:has(#bSysn){border-radius:18px;padding:10px 16px;box-shadow:0 10px 28px rgba(0,0,0,.5)}
.row:has(#bSysn) button.ic{border-radius:14px;border-width:1.5px}
body{display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-rows:auto minmax(0,1fr) auto;gap:10px 12px;align-items:center}
header{display:contents}
.proj{grid-row:3;grid-column:1;justify-self:start}
.pill{grid-row:3;grid-column:3;justify-self:end}
.row:has(#bSysn){grid-row:3;grid-column:2;justify-self:stretch;justify-content:space-evenly;gap:0;padding:0 12px;box-shadow:none;border-color:transparent;border-radius:16px}
.row:has(#bSysn) button.ic{width:40px;height:40px}
.row:has(#bSysn) button.ic svg{width:20px;height:20px}
.row:has(#bSysn){justify-content:flex-start;gap:10px}
.row:has(#bSysn) button.ic{width:auto;height:40px;padding:0 14px;gap:8px}
button.ic::after{font-size:13px;font-weight:600;white-space:nowrap}
#bRestore{order:1}
#bMaster{order:2}
#bClear{order:3}
#bSysn{order:4}
#bBig{order:5}
#bSysn{display:none!important}
#bBig::after{content:none}
.row:has(#bSysn) #bBig{width:40px;padding:0;gap:0}
#bRestore::after{content:"Restore"}
#bMaster::after{content:"Save master"}
#bClear::after{content:"Clear log"}
#bCopy::after{content:none}
#logbox #bCopy{width:34px;padding:0;gap:0}
#logbox #log{padding-right:54px}
#bSysn{order:1}
#bBig{order:2}
#bMaster{order:3}
#bRestore{order:4}
#bClear{display:none!important}
#bBig::after{content:"Multi Login"}
.row:has(#bSysn) #bBig{width:auto;padding:0 14px;gap:8px}
.proj{display:none!important}
.row:has(#bSysn){grid-column:1/3}
#keep{grid-row:1;grid-column:1/-1}
#panes{grid-row:2;grid-column:1/-1;align-self:stretch}
@media(max-width:700px){body{grid-template-rows:auto minmax(0,1fr) auto auto}.row:has(#bSysn){grid-row:4;grid-column:1/-1}}
</style>
</head>
<body>
<header>
  <h1>Folder Downloader</h1>
  <div class="proj"><button id="bPE">EXTOS</button></div>
</header>

<div class="row">
  <button class="main ic" id="bSysn"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M12 11v4M10 13h4"/></svg></button>
  <button class="ic" id="bOpen" title="Open folder" aria-label="Open folder"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v1H7l-4 8z"/><path d="M7 10h15l-3 8H3z"/></svg></button>
  <button class="ic" id="bZip"><svg viewBox="0 0 24 24"><path d="M12 4v10M8 10l4 4 4-4M5 19h14"/></svg></button>
  <button class="ic" id="bRepoFFT" title="Download FFT repo folder" aria-label="Download FFT repo folder"><svg viewBox="0 0 24 24"><path d="M7 17a4 4 0 0 1-.6-7.96A6 6 0 0 1 18 9a4 4 0 0 1-1 8"/><path d="M12 11v8M9 16l3 3 3-3"/></svg></button>
  <button class="ic" id="bRepoEXTOS" title="Download EXTOS repo folder" aria-label="Download EXTOS repo folder"><svg viewBox="0 0 24 24"><path d="M7 17a4 4 0 0 1-.6-7.96A6 6 0 0 1 18 9a4 4 0 0 1-1 8"/><path d="M12 11v8M9 16l3 3 3-3"/></svg></button>
  <button class="ic" id="bBig" title="Download WWW.zip from archive.org (opens a new tab)" aria-label="Download WWW.zip from archive.org (opens a new tab)"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20v-1a5 5 0 0 1 5-5h2a5 5 0 0 1 5 5v1"/><circle cx="17" cy="9" r="2.5"/><path d="M17 14a4 4 0 0 1 4 4v2"/></svg></button>
  <button class="ic" id="bClear" title="Clear log" aria-label="Clear log"><svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/></svg></button>
      </div>
      
      <div class="row" id="setupRow" style="justify-content: center; padding: 20px; display: flex;">
        <button class="main ic" id="bSysnCenter" style="width: auto; padding: 0 20px; gap: 10px;">
          <svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M12 11v4M10 13h4"/></svg>
          Select Pictures Folder
        </button>
      </div>
  
      <div id="panes">
        <div id="logbox"><div id="log" aria-live="off"></div><button class="ic" id="bCopy" title="Copy log" aria-label="Copy log"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg></button></div>
      </div>

<script>
'use strict';
// ───────── Projects ─────────
const PROJECTS = {
  extos:  { name: 'EXTOS', sfx: '', picker: 'extsync', pickerParent: 'extsyncparent' }
};
const PK = 'extos';
const P = PROJECTS[PK];
document.documentElement.dataset.p = PK;
document.title = P.name + ' Downloader';

// ───────── Settings ─────────
const VERSION   = '3.0';
const SYSN_NAME = P.name;
const SKIP_DIRS = new Set(['.git', 'node_modules', 'EXTOS', 'FFT']);
const SKIP_FILE = /(^|\/)(\.DS_Store|Thumbs\.db|desktop\.ini)$|\.crswap$|~$/;

// ───────── Helpers ─────────
const $ = id => document.getElementById(id);
const DEVICE = (function () {
  let d = localStorage.getItem('extsync.device');
  if (!d) { d = Math.random().toString(36).slice(2, 8); localStorage.setItem('extsync.device', d); }
  return d;
})();

// project labels and switcher
$('bSysn').title = 'Create ' + P.name + ' folder & sync';
$('bSysn').setAttribute('aria-label', 'Create ' + P.name + ' folder and sync');
$('bZip').title = 'Download ' + P.name + '.zip';
$('bZip').setAttribute('aria-label', 'Download ' + P.name + '.zip');
$('bPE').className = 'on';

const lines = [];
const logEl = $('log');
function log(level, msg) {
  const t = new Date().toISOString().slice(11, 23);
  const line = t + ' [' + level + '] ' + msg;
  lines.push(line);
  if (lines.length > 3000) lines.shift();
  const d = document.createElement('div');
  d.className = level;
  d.textContent = line;
  logEl.appendChild(d);
  while (logEl.childElementCount > 1500) logEl.removeChild(logEl.firstChild);
  logEl.scrollTop = logEl.scrollHeight;
}

// ───────── Tiny IndexedDB (remembers the chosen folder, one key per project) ─────────
const HANDLE_KEY = 'handle' + P.sfx;
const PARENT_KEY = 'parent' + P.sfx;
function idb() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('extsync', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function idbGet(k) {
  const d = await idb();
  return new Promise((res, rej) => { const q = d.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); });
}
async function idbSet(k, v) {
  const d = await idb();
  return new Promise((res, rej) => { const t = d.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = () => res(); t.onerror = () => rej(t.error); });
}

// ───────── Local folder access ─────────
let root = null;

async function scan(dir, prefix, out) {
  for await (const [name, h] of dir.entries()) {
    if (h.kind === 'directory') { if (!SKIP_DIRS.has(name)) await scan(h, prefix + name + '/', out); }
    else if (!SKIP_FILE.test(prefix + name)) out.set(prefix + name, h);
  }
}
// ───────── Folder connect ─────────
async function useFolder(h, fresh) {
  root = h;
  $('setupRow').style.display = 'none';
  document.querySelector('.row:has(#bSysn)').style.display = 'flex';
  log('ok', 'folder connected: "' + h.name + '"' + (fresh ? ' (new connection)' : ' (restored)'));
}
async function pickFolder() {
  if (!window.showDirectoryPicker) { log('err', 'showDirectoryPicker is not available: use desktop Chrome or Edge over https'); return; }
  let h;
  try { h = await window.showDirectoryPicker({ mode: 'readwrite', id: P.picker }); }
  catch (e) { log('warn', 'folder picker closed: ' + e.name); return; }
  await idbSet(HANDLE_KEY, h);
  await useFolder(h, true);
}
async function setupSysn() {
  if (!window.showDirectoryPicker) { log('err', 'showDirectoryPicker is not available: use desktop Chrome or Edge over https'); return; }
  log('info', P.name + ' setup: pick where the ' + P.name + ' folder should be created (browser will ask for permission)');
  var parent, h, existed = true;
  try { parent = await window.showDirectoryPicker({ mode: 'readwrite', id: P.pickerParent, startIn: 'documents' }); }
  catch (e) { log('warn', 'SYSN setup cancelled: ' + e.name); return; }
  try {
    if (parent.name === SYSN_NAME) { h = parent; }
    else {
      try { await parent.getDirectoryHandle(SYSN_NAME); } catch (e) { existed = false; }
      h = await parent.getDirectoryHandle(SYSN_NAME, { create: true });
    }
  } catch (e) { log('err', 'could not create ' + SYSN_NAME + ': ' + e.message); return; }
  log('ok', 'permission granted · folder ' + SYSN_NAME + (existed ? ' ready (already existed)' : ' CREATED') + ' inside "' + parent.name + '"');
      if (parent.name !== SYSN_NAME) await idbSet(PARENT_KEY, parent);
      await idbSet(HANDLE_KEY, h);
    await useFolder(h, true);
    log('ok', P.name + ' folder ready for downloads.');
        if (parent.name !== SYSN_NAME) {
        await saveRepo(parent, 'EXTOS');
        await saveRepo(parent, 'FFT');
      }
  }
async function resumeFolder() {
  const h = await idbGet(HANDLE_KEY);
  if (!h) return;
  const p = await h.requestPermission({ mode: 'readwrite' });
  log('info', 'folder permission: ' + p);
  if (p === 'granted') await useFolder(h, false);
}

// ───────── Wiring ─────────
async function openFolder() {
  if (!root) { log('warn', 'connect the ' + P.name + ' folder first'); return; }
  try { await window.showDirectoryPicker({ mode: 'read', startIn: root }); }
  catch (e) { /* dialog closed */ }
}
var CRC_T = (function () {
  var t = [], c, n, k;
  for (n = 0; n < 256; n++) { c = n; for (k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; }
  return t;
})();
function crc32(b) {
  var c = 0xFFFFFFFF;
  for (var i = 0; i < b.length; i++) c = CRC_T[(c ^ b[i]) & 255] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
async function downloadZip() {
  if (!root) { log('warn', 'connect the ' + P.name + ' folder first'); return; }
  try {
    var fh = null;
        if (window.showSaveFilePicker) {
          try { fh = await window.showSaveFilePicker({ suggestedName: P.name + '.zip', types: [{ description: 'ZIP archive', accept: { 'application/zip': ['.zip'] } }] }); }
          catch (e) { if (e.name === 'AbortError') { log('warn', 'zip save cancelled'); return; } log('warn', 'save dialog unavailable: ' + e.name); }
        }
        var handles = new Map();
    await scan(root, '', handles);
    var ents = Array.from(handles.entries());
    var enc = new TextEncoder(), parts = [], central = [], offset = 0, i, csize = 0;
    for (i = 0; i < ents.length; i++) {
      var p = ents[i][0], f = await ents[i][1].getFile();
      var data = new Uint8Array(await f.arrayBuffer()), name = enc.encode(p), crc = crc32(data);
      var d = new Date(f.lastModified);
      var dt = (((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate()) & 0xFFFF;
      var tm = ((d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1)) & 0xFFFF;
      var lh = new DataView(new ArrayBuffer(30));
      lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true);
      lh.setUint16(8, 0, true); lh.setUint16(10, tm, true); lh.setUint16(12, dt, true);
      lh.setUint32(14, crc, true); lh.setUint32(18, data.length, true); lh.setUint32(22, data.length, true);
      lh.setUint16(26, name.length, true); lh.setUint16(28, 0, true);
      var ch = new DataView(new ArrayBuffer(46));
      ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true);
      ch.setUint16(8, 0x0800, true); ch.setUint16(10, 0, true); ch.setUint16(12, tm, true); ch.setUint16(14, dt, true);
      ch.setUint32(16, crc, true); ch.setUint32(20, data.length, true); ch.setUint32(24, data.length, true);
      ch.setUint16(28, name.length, true); ch.setUint32(42, offset, true);
      parts.push(lh.buffer, name, data);
      central.push(ch.buffer, name);
      csize += 46 + name.length;
      offset += 30 + name.length + data.length;
    }
    var end = new DataView(new ArrayBuffer(22));
    end.setUint32(0, 0x06054b50, true); end.setUint16(8, ents.length, true); end.setUint16(10, ents.length, true);
    end.setUint32(12, csize, true); end.setUint32(16, offset, true);
    var blob = new Blob(parts.concat(central, [end.buffer]), { type: 'application/zip' });
    if (fh) {
          var w = await fh.createWritable();
          await w.write(blob);
          await w.close();
          log('ok', P.name + '.zip saved (' + ents.length + ' files, ' + blob.size + ' B)');
          return;
        }
        var url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = P.name + '.zip';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 60000);
    log('ok', P.name + '.zip downloaded (' + ents.length + ' files, ' + blob.size + ' B)');
  } catch (e) { log('err', 'zip failed: ' + e.message); }
}
$('bOpen').onclick = openFolder;
$('bZip').onclick = downloadZip;
async function saveRepo(given, repoName) {
  repoName = repoName || 'EXTOS';
  var btn = $('bRepo' + repoName), parent = null, perm, res, buf, fh, w;
    var tree, i, r2, data, name, crc, enc, zparts, zcentral, zoff, zcs, d, dt, tm, lh, ch, zend;
      var fl, rd, dd, fw, j, sp, nm;
  if (btn && btn.disabled) return;
  if (!window.showDirectoryPicker) { log('err', 'showDirectoryPicker is not available: use desktop Chrome or Edge over https'); return; }
  btn.disabled = true;
  try {
    if (given) parent = given;
        else { try { parent = await idbGet(PARENT_KEY); } catch (e) { parent = null; } }
    if (parent) {
      perm = await parent.requestPermission({ mode: 'readwrite' });
      if (perm !== 'granted') parent = null;
    }
    if (!parent) {
          try { parent = await window.showDirectoryPicker({ mode: 'readwrite', id: P.pickerParent, startIn: 'pictures' }); }
          catch (e) { log('warn', 'repo save cancelled: ' + e.name); return; }
          if (parent.name === SYSN_NAME) { log('warn', 'pick the folder that contains ' + SYSN_NAME + ', not ' + SYSN_NAME + ' itself'); return; }
          await idbSet(PARENT_KEY, parent);
        }
        log('info', 'downloading ' + repoName + ' repo from GitHub…');
                    res = await fetch('https://api.github.com/repos/888znq/' + repoName + '/git/trees/HEAD?recursive=1');
                        if (!res.ok) throw new Error('GitHub answered ' + res.status);
                        tree = (await res.json()).tree.filter(function (n) { return n.type === 'blob'; });
                        if (!tree.length) throw new Error('repo is empty');
                        fl = [];
                        for (i = 0; i < tree.length; i++) {
                          r2 = await fetch('https://raw.githubusercontent.com/888znq/' + repoName + '/HEAD/' + tree[i].path.split('/').map(encodeURIComponent).join('/'));
                          if (!r2.ok) throw new Error('GitHub answered ' + r2.status + ' for ' + tree[i].path);
                          data = new Uint8Array(await r2.arrayBuffer());
                                fl.push({ p: tree[i].path, data: data });
                                
                        }
                    
                    rd = await parent.getDirectoryHandle(repoName, { create: true });
                    for (i = 0; i < fl.length; i++) {
                      sp = fl[i].p.split('/'); nm = sp.pop(); dd = rd;
                      for (j = 0; j < sp.length; j++) dd = await dd.getDirectoryHandle(sp[j], { create: true });
                      fw = await (await dd.getFileHandle(nm, { create: true })).createWritable();
                      await fw.write(fl[i].data);
                      await fw.close();
                    }
                    log('ok', repoName + ' folder extracted in "' + parent.name + '" (' + fl.length + ' files)');
              } catch (e) { log('err', 'repo folder save failed: ' + e.message); }
          finally { if (btn) btn.disabled = false; }
          }
  var BIG_URL = 'https://archive.org/download/wwwwwwww_202611/WWW.zip';
  var BIG_NAME = 'WWW.zip';
  async function bigProbe() {
    var pr;
    try {
      pr = await fetch(BIG_URL, { method: 'HEAD', mode: 'no-cors' });
      log('warn', 'probe: archive.org is reachable (' + pr.type + ') but the normal request was blocked by cross-site rules (CORS), so this page cannot read the file');
    } catch (x) {
      log('warn', 'probe: archive.org cannot be reached from this browser (' + x.name + ': ' + x.message + '), check internet, VPN, ad blocker or firewall');
    }
  }
  async function saveBig() {
    var btn = $('bBig'), parent = null, perm, res, total, rd, w = null, got = 0, last = 0, r, t0;
    if (btn.disabled) return;
    if (!window.showDirectoryPicker) { log('err', 'showDirectoryPicker is not available: use desktop Chrome or Edge over https'); return; }
    btn.disabled = true;
    try {
      try { parent = await idbGet(PARENT_KEY); } catch (e) { parent = null; }
      if (parent) {
        perm = await parent.requestPermission({ mode: 'readwrite' });
        if (perm !== 'granted') parent = null;
      }
      if (!parent) {
        try { parent = await window.showDirectoryPicker({ mode: 'readwrite', id: P.pickerParent, startIn: 'pictures' }); }
        catch (e) { log('warn', BIG_NAME + ' download cancelled: ' + e.name); return; }
        if (parent.name === SYSN_NAME) { log('warn', 'pick the folder that contains ' + SYSN_NAME + ', not ' + SYSN_NAME + ' itself'); return; }
        await idbSet(PARENT_KEY, parent);
      }
      log('info', 'downloading ' + BIG_NAME + ' from archive.org…');
      log('net', 'GET ' + BIG_URL);
          res = await fetch(BIG_URL);
          log('net', 'archive.org answered ' + res.status + (res.redirected ? ' via redirect to ' + res.url : '') + ' · ' + res.type + ' · ' + (res.headers.get('content-length') || 'size unknown') + ' B');
      if (!res.ok || !res.body) throw new Error('archive.org answered ' + res.status);
      total = +res.headers.get('content-length') || 0;
      w = await (await parent.getFileHandle(BIG_NAME, { create: true })).createWritable();
      rd = res.body.getReader();
      t0 = Date.now();
      while (true) {
        r = await rd.read();
        if (r.done) break;
        await w.write(r.value);
        got += r.value.length;
        if (Date.now() - last > 3000) {
          last = Date.now();
          log('net', BIG_NAME + ': ' + Math.round(got / 1048576) + (total ? ' / ' + Math.round(total / 1048576) : '') + ' MB');
        }
      }
      if (total && got !== total) throw new Error('incomplete download (' + got + ' of ' + total + ' B)');
      await w.close();
      w = null;
      log('ok', BIG_NAME + ' saved in "' + parent.name + '" (' + Math.round(got / 1048576) + ' MB, ' + Math.round((Date.now() - t0) / 1000) + ' s)');
    } catch (e) {
      if (w) { try { await w.abort(); } catch (x) {} }
      log('err', BIG_NAME + ' download failed: ' + e.name + ': ' + e.message + ' (' + Math.round(got / 1048576) + ' MB received)');
          if (got === 0 && e.name === 'TypeError') await bigProbe();
    }
    finally { btn.disabled = false; }
  }
  $('bRepoFFT').onclick = function () { saveRepo(null, 'FFT'); };
      $('bRepoEXTOS').onclick = function () { saveRepo(null, 'EXTOS'); };
      $('bBig').onclick = function () { log('info', 'opening ' + BIG_NAME + ' in a new tab'); window.open(BIG_URL, '_blank', 'noopener'); };
  $('bSysnCenter').onclick = setupSysn;
  $('bClear').onclick = () => { lines.length = 0; logEl.textContent = ''; };
$('bCopy').onclick = async () => {
  const text = lines.join('\n');
  try { await navigator.clipboard.writeText(text); log('ok', 'log copied (' + lines.length + ' lines)'); }
  catch (e) {
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); ta.remove();
    log('ok', 'log copied (fallback, ' + lines.length + ' lines)');
  }
};
window.addEventListener('error', e => log('err', 'uncaught: ' + e.message));
window.addEventListener('unhandledrejection', e => log('err', 'unhandled: ' + (e.reason && e.reason.message || e.reason)));

// ───────── Startup ─────────
(async function init() {
  log('info', 'Downloader v' + VERSION + ' · project ' + P.name + ' · device ' + DEVICE);
  log('info', 'browser: ' + navigator.userAgent);
  log('info', 'secure context: ' + window.isSecureContext + ' · folder API: ' + !!window.showDirectoryPicker);
  try {
    const h = await idbGet(HANDLE_KEY);
    if (h) {
      const p = await h.queryPermission({ mode: 'readwrite' });
      log('info', 'saved folder "' + h.name + '", permission: ' + p);
      if (p === 'granted') await useFolder(h, false);
      else { log('warn', 'Click Choose folder to reconnect'); }
    }
  } catch (e) { log('warn', 'could not restore saved folder: ' + e.message); }
})();
