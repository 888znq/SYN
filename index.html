<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Folder Sync</title>
<style>
:root{--bg:#14161a;--panel:#1c1f25;--line:#2c313b;--tx:#e8eaee;--mut:#8f97a6;--ok:#4fd1a1;--warn:#f2b84b;--err:#ff7b7b;--up:#7db4ff;--btn:#272c35}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;gap:10px;padding:12px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-size:18px;margin:0;font-weight:650;letter-spacing:.2px}
.pill{display:inline-flex;align-items:center;gap:8px;padding:5px 12px;border:1px solid var(--line);border-radius:999px;background:var(--panel);font-weight:600}
.pill i{width:9px;height:9px;border-radius:50%;background:var(--mut)}
.pill[data-s=synced] i{background:var(--ok)}
.pill[data-s=syncing] i{background:var(--up)}
.pill[data-s=error] i{background:var(--err)}
.pill[data-s=paused] i{background:var(--warn)}
#done{display:none;padding:10px 14px;border:1px solid var(--ok);border-radius:8px;color:var(--ok);font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button{font:inherit;color:var(--tx);background:var(--btn);border:1px solid var(--line);border-radius:7px;padding:7px 12px;cursor:pointer}
button:hover{border-color:var(--mut)}
button:focus-visible{outline:2px solid var(--up);outline-offset:2px}
button.main{background:#2f5fb3;border-color:#2f5fb3;font-weight:600}
button.danger{color:var(--err)}
.sp{flex:1}
h1,#info,#done,#bPick,#bResume,#bNow,#bPause,#bTest,#bList,#bReset,.sp{display:none!important}
button.ic{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;padding:0}
button.ic svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#info{color:var(--mut);font-size:13px}
#log{flex:1;min-height:200px;overflow:auto;background:#0e1013;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:12px/1.5 ui-monospace,Consolas,monospace;white-space:pre-wrap;word-break:break-all}
#log div{color:#c5cad4}
#log .net{color:var(--mut)}
#log .up{color:var(--up)}
#log .down,#log .ok{color:var(--ok)}
#log .warn{color:var(--warn)}
#log .err{color:var(--err)}
#keep{display:none;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 12px;border:1px solid var(--warn);border-radius:8px;color:var(--warn);font-size:13px}
#keep span{flex:1;min-width:200px}
#panes{flex:1 1 0;min-height:200px;display:flex;gap:10px}
#log{flex:1 1 0;min-width:0;min-height:0}
#tree{flex:1 1 0;min-width:0;min-height:0;overflow:auto;background:#0e1013;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:13px/1.6 ui-monospace,Consolas,monospace}
#tree .th{color:var(--mut);font-size:12px;padding-bottom:6px;margin-bottom:4px;border-bottom:1px solid var(--line)}
#tree .te{color:var(--mut)}
#tree summary{cursor:pointer;color:var(--tx);padding:1px 0}
#tree details>*:not(summary){margin-left:16px}
#tree .tf{display:flex;align-items:center;gap:8px;color:#c5cad4}
#tree .tf i{width:8px;height:8px;border-radius:50%;flex:none;background:var(--mut)}
#tree .tf span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#tree .tf em{font-style:normal;color:var(--mut);font-size:12px}
#tree .ok i{background:var(--ok)}
#tree .loc i{background:var(--up)}
#tree .cld i{background:var(--warn)}
#tree .diff i{background:var(--err)}
@media(max-width:700px){#panes{flex-direction:column}}
</style>
</head>
<body>
<header>
  <h1>Folder Sync</h1>
  <span class="pill" id="pill" data-s="idle"><i></i><span id="pillTxt">No folder</span></span>
</header>

<div id="done">Done. The folder is up to date. Load unpacked in Chrome from this folder; keep this page open while you edit.</div>

<div class="row">
  <button class="main ic" id="bSysn" title="Create EXTOS folder &amp; sync" aria-label="Create EXTOS folder and sync"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M12 11v4M10 13h4"/></svg></button>
    <button id="bPick">Choose existing folder</button>
  <button id="bResume" style="display:none">Reconnect folder</button>
  <button id="bNow">Sync now</button>
  <button id="bPause">Pause</button>
  <span class="sp"></span>
  <button id="bTest">Push test file to cloud</button>
  <button id="bList">List cloud files</button>
  <button class="danger" id="bReset">Reset cloud</button>
</div>
<div id="info">No folder connected.</div>

<div class="row">
  <button class="ic" id="bCopy" title="Copy log" aria-label="Copy log"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg></button>
  <button class="ic" id="bClear" title="Clear log" aria-label="Clear log"><svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/></svg></button>
</div>
<div id="keep"><span id="keepTxt"></span><button id="bKeepSite" title="Copy this site's address">Copy site</button><button id="bKeepLink" title="Copy the browser settings link">Copy settings link</button><button id="bKeepX" title="Dismiss" aria-label="Dismiss">✕</button></div>
<div id="panes">
  <div id="log" aria-live="off"></div>
  <div id="tree"><div class="te">No folder connected</div></div>
</div>

<script>
'use strict';
// ───────── Settings ─────────
const VERSION   = '0.4';
const DB_URL    = 'https://system-data-bf026-default-rtdb.asia-southeast1.firebasedatabase.app';
const DB_PATH   = 'extSync/main';          // the ONLY branch this page touches
const POLL_MS   = 3000;
const SYSN_NAME = 'EXTOS';                  // folder created automatically inside the location you pick
const MAX_BYTES = 5 * 1024 * 1024;         // larger files are skipped (with a warning)
const SKIP_DIRS = new Set(['.git', 'node_modules']);
const SKIP_FILE = /(^|\/)(\.DS_Store|Thumbs\.db|desktop\.ini)$|\.crswap$|~$/;

// Hard-coded test file (used by "Push test file to cloud"). Acts like "another device".
const TEST_FILE = {
  path: 'sync-test/hello.txt',
  text: 'Hello from the cloud.\nIf this file appears in your local folder, DOWNLOAD works.\nEdit it and save: it should upload within a few seconds.\nPushed at: '
};

if (/^(textNotes|splitView)(\/|$)/i.test(DB_PATH)) throw new Error('DB_PATH must not point at other apps');

// ───────── Helpers ─────────
const $ = id => document.getElementById(id);
const DEVICE = (function () {
  let d = localStorage.getItem('extsync.device');
  if (!d) { d = Math.random().toString(36).slice(2, 8); localStorage.setItem('extsync.device', d); }
  return d;
})();

const lines = [];
const logEl = $('log');
function log(level, msg) {
  const t = new Date().toISOString().slice(11, 23);
  const line = t + ' [' + level + '] ' + msg;
  lines.push(line);
  if (lines.length > 3000) lines.shift();
  const d = document.createElement('div');
  d.className = level;
  d.textContent = line;
  logEl.appendChild(d);
  while (logEl.childElementCount > 1500) logEl.removeChild(logEl.firstChild);
  logEl.scrollTop = logEl.scrollHeight;
}

function setStatus(s, txt) {
  $('pill').dataset.s = s;
  $('pillTxt').textContent = txt;
}

// Firebase decodes %2E / %2F inside the URL path, so keys may only contain safe characters.
// Everything except letters, digits, _ and - becomes ~XX (hex of each UTF-8 byte). The real path lives in meta.path.
const keyOf = p => Array.from(new TextEncoder().encode(p)).map(function (c) {
  const ch = String.fromCharCode(c);
  return /[A-Za-z0-9_-]/.test(ch) ? ch : '~' + c.toString(16).padStart(2, '0');
}).join('');
function b64enc(buf) {
  const b = new Uint8Array(buf); let s = '';
  for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000));
  return btoa(s);
}
function b64dec(s) {
  const bin = atob(s), b = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) b[i] = bin.charCodeAt(i);
  return b;
}
async function sha(buf) {
  const h = await crypto.subtle.digest('SHA-256', buf);
  return Array.from(new Uint8Array(h)).map(x => x.toString(16).padStart(2, '0')).join('');
}
const short = h => h ? h.slice(0, 8) : '-';

// ───────── Tiny IndexedDB (remembers the chosen folder) ─────────
function idb() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('extsync', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function idbGet(k) {
  const d = await idb();
  return new Promise((res, rej) => { const q = d.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); });
}
async function idbSet(k, v) {
  const d = await idb();
  return new Promise((res, rej) => { const t = d.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = () => res(); t.onerror = () => rej(t.error); });
}

// ───────── Firebase REST ─────────
async function db(method, sub, body, quiet) {
  const url = DB_URL + '/' + DB_PATH + (sub ? '/' + sub : '') + '.json';
  const t0 = performance.now();
  let r;
  try {
    r = await fetch(url, { method, body: body === undefined ? undefined : JSON.stringify(body), cache: 'no-store', signal: AbortSignal.timeout(20000) });
  } catch (e) {
    throw new Error(method + ' ' + sub + ' network error: ' + e.name + ' after ' + Math.round(performance.now() - t0) + ' ms');
  }
  const ms = Math.round(performance.now() - t0);
  if (!quiet) log('net', method + ' ' + (sub || '/') + ' → ' + r.status + ' (' + ms + ' ms)');
  else if (ms > 3000) log('warn', 'slow request: ' + method + ' ' + (sub || '/') + ' took ' + ms + ' ms');
  if (!r.ok) throw new Error(method + ' ' + sub + ' → HTTP ' + r.status + (r.status === 401 || r.status === 403 ? ' (denied: check Firebase rules)' : ''));
  return method === 'GET' ? r.json() : null;
}

// ───────── Local folder access ─────────
let root = null;
let base = JSON.parse(localStorage.getItem('extsync.base') || '{}');   // path → hash at last sync
const hcache = new Map();                                              // path → {m,s,h}
const saveBase = () => localStorage.setItem('extsync.base', JSON.stringify(base));

async function scan(dir, prefix, out) {
  for await (const [name, h] of dir.entries()) {
    if (h.kind === 'directory') { if (!SKIP_DIRS.has(name)) await scan(h, prefix + name + '/', out); }
    else if (!SKIP_FILE.test(prefix + name)) out.set(prefix + name, h);
  }
}
const warned = new Set();
async function localState() {
  const handles = new Map();
  await scan(root, '', handles);
  const out = new Map();
  for (const [p, h] of handles) {
    const f = await h.getFile();
    if (f.size > MAX_BYTES) { if (!warned.has(p)) { warned.add(p); log('warn', 'skipping ' + p + ' (' + f.size + ' bytes > limit)'); } continue; }
    const c = hcache.get(p);
    let hash;
    if (c && c.m === f.lastModified && c.s === f.size) hash = c.h;
    else { hash = await sha(await f.arrayBuffer()); hcache.set(p, { m: f.lastModified, s: f.size, h: hash }); }
    out.set(p, { hash, mtime: f.lastModified, size: f.size });
  }
  return out;
}
async function dirFor(path, create) {
  const parts = path.split('/'), name = parts.pop();
  if (!name || parts.concat(name).some(s => !s || s === '.' || s === '..')) throw new Error('unsafe path: ' + path);
  let d = root;
  for (const s of parts) d = await d.getDirectoryHandle(s, { create });
  return { d, name };
}
async function readLocal(p) {
  const { d, name } = await dirFor(p, false);
  const f = await (await d.getFileHandle(name)).getFile();
  const buf = await f.arrayBuffer();
  return { buf, hash: await sha(buf), mtime: f.lastModified };
}
async function writeLocal(p, bytes) {
  const { d, name } = await dirFor(p, true);
  const w = await (await d.getFileHandle(name, { create: true })).createWritable();
  await w.write(bytes);
  await w.close();
}
async function deleteLocal(p) {
  const { d, name } = await dirFor(p, false);
  await d.removeEntry(name);
}

// ───────── Cloud operations (history keeps old versions) ─────────
let remote = {};
async function archiveCloud(p, reason) {
  const key = keyOf(p);
  const [m, b] = await Promise.all([db('GET', 'meta/' + key, undefined, true), db('GET', 'blobs/' + key, undefined, true)]);
  if (!m || m.deleted || b == null) return;
  await db('PUT', 'history/' + Date.now() + '_' + key, { path: p, hash: m.hash, mtime: m.mtime, content: b, reason, by: DEVICE });
  log('info', 'snapshot saved: ' + p + ' (' + reason + ')');
}
async function archiveLocal(p, reason) {
  const l = await readLocal(p);
  await db('PUT', 'history/' + Date.now() + '_' + keyOf(p), { path: p, hash: l.hash, mtime: l.mtime, content: b64enc(l.buf), reason, by: DEVICE });
  log('info', 'snapshot saved (local copy): ' + p + ' (' + reason + ')');
}
async function upload(p) {
  const l = await readLocal(p), key = keyOf(p);
  if (remote[p] && !remote[p].deleted) await archiveCloud(p, 'before overwrite');
  await db('PUT', 'blobs/' + key, b64enc(l.buf));
  await db('PUT', 'meta/' + key, { path: p, hash: l.hash, size: l.buf.byteLength, mtime: l.mtime, deleted: false, by: DEVICE });
  base[p] = l.hash;
  log('up', 'UPLOADED ' + p + ' (' + l.buf.byteLength + ' B, ' + short(l.hash) + ')');
}
async function download(p) {
  const b = await db('GET', 'blobs/' + keyOf(p));
  if (b == null) throw new Error('cloud has meta but no content for ' + p);
  const bytes = b64dec(b), hash = await sha(bytes);
  if (remote[p] && remote[p].hash !== hash) log('warn', 'cloud changed during download of ' + p + '; using what arrived');
  await writeLocal(p, bytes);
  base[p] = hash;
  hcache.delete(p);
  log('down', 'DOWNLOADED ' + p + ' (' + bytes.length + ' B, ' + short(hash) + ')');
}
async function purgeHistory(p) {
  const key = keyOf(p);
  try {
    const r = await fetch(DB_URL + '/' + DB_PATH + '/history.json?shallow=true', { cache: 'no-store', signal: AbortSignal.timeout(20000) });
    if (!r.ok) throw new Error('history list → HTTP ' + r.status);
    const ks = Object.keys((await r.json()) || {}).filter(function (k) { return k.slice(k.indexOf('_') + 1) === key; });
    for (const k of ks) await db('DELETE', 'history/' + k, undefined, true);
    if (ks.length) log('info', 'purged ' + ks.length + ' old snapshot(s) of ' + p);
  } catch (e) { log('warn', 'could not purge snapshots of ' + p + ': ' + e.message); }
}
async function deleteCloud(p) {
  const key = keyOf(p);
  await purgeHistory(p);
  await db('PUT', 'meta/' + key, { path: p, deleted: true, hash: null, mtime: Date.now(), by: DEVICE });
  await db('DELETE', 'blobs/' + key);
  delete base[p];
  log('up', 'DELETED in cloud ' + p);
}

// ───────── Sync cycle ─────────
let busy = false, paused = false, cycles = 0, announced = false;
let busySince = 0;
async function cycle(why) {
  if (!root) return;
  if (busy) {
    const s = Date.now() - busySince;
    if (s > 5000) log('warn', 'cycle "' + why + '" skipped: previous cycle still running (' + Math.round(s / 1000) + ' s)');
    return;
  }
  busy = true; busySince = Date.now();
  let errs = 0;
  try {
    if (!paused) setStatus('syncing', 'Syncing…');
    const loc = await localState();
    const rm = (await db('GET', 'meta', undefined, true)) || {};
    remote = {};
    for (const k in rm) if (rm[k] && rm[k].path) remote[rm[k].path] = rm[k];
    const live = Object.values(remote).filter(m => !m.deleted).length;

    const acts = [];
    const paths = new Set([...loc.keys(), ...Object.keys(remote), ...Object.keys(base)]);
    for (const p of paths) {
      const L = loc.get(p), Rm = remote[p], R = Rm && !Rm.deleted ? Rm : null, B = base[p];
      const lh = L ? L.hash : null, rh = R ? R.hash : null;
      if (lh === rh) { if (lh) base[p] = lh; else delete base[p]; continue; }
      if (L && !R) {
        if (B && lh === B && Rm && Rm.deleted) acts.push(['dl', p, 'deleted on another device']);
        else if (B && lh !== B) acts.push(['up', p, 'edited locally']);
        else acts.push(['up', p, B ? 'missing in cloud, re-uploading' : 'new local file']);
      } else if (!L && R) {
        if (B && rh === B) acts.push(['dr', p, 'deleted locally']);
        else acts.push(['down', p, B ? 'changed in cloud (local copy was deleted)' : 'new cloud file']);
      } else {
        if (lh === B) acts.push(['down', p, 'changed in cloud']);
        else if (rh === B) acts.push(['up', p, 'edited locally']);
        else if (L.mtime >= R.mtime) acts.push(['up', p, 'conflict: local is newer (' + short(lh) + ' vs ' + short(rh) + ')']);
        else acts.push(['cdown', p, 'conflict: cloud is newer (' + short(lh) + ' vs ' + short(rh) + ')']);
      }
    }

    if (acts.length) {
      log('info', 'cycle ' + (++cycles) + ' (' + why + '): local ' + loc.size + ' files, cloud ' + live + ' files, ' + acts.length + ' change(s)');
      for (const [t, p, reason] of acts) {
        log('info', '• ' + t + ' ' + p + ': ' + reason);
        try {
          if (t === 'up') await upload(p);
          else if (t === 'down') await download(p);
          else if (t === 'cdown') { await archiveLocal(p, 'lost conflict'); await download(p); }
          else if (t === 'dl') { await deleteLocal(p); delete base[p]; log('down', 'DELETED locally ' + p); }
          else if (t === 'dr') await deleteCloud(p);
        } catch (e) { errs++; log('err', t + ' ' + p + ' failed: ' + e.message); }
      }
    } else if (++cycles % 10 === 0 || why === 'manual') {
      log('info', 'cycle ' + cycles + ' (' + why + '): all in sync, local ' + loc.size + ', cloud ' + live);
    }
    saveBase();
    drawTree(loc, acts.length > 0);
        $('info').textContent = 'Folder: ' + root.name + ' · local ' + loc.size + ' files · cloud ' + live + ' files · last check ' + new Date().toLocaleTimeString();
    if (errs) setStatus('error', 'Error (see log)');
    else {
      setStatus(paused ? 'paused' : 'synced', paused ? 'Paused' : 'Synced');
      if (!announced) { announced = true; $('done').style.display = 'block'; log('ok', 'DONE: folder is up to date with the cloud'); }
    }
  } catch (e) {
    if (e.name === 'NotFoundError') {
          if (timer) { clearInterval(timer); timer = null; }
          root = null;
          setStatus('paused', 'Folder missing: click EXTOS icon');
          log('err', 'connected folder no longer exists (deleted or moved). Auto-sync stopped, cloud untouched. Click the EXTOS icon to reconnect.');
          return;
        }
        setStatus('error', e.message.indexOf('network') >= 0 ? 'Offline' : 'Error (see log)');
    log('err', 'cycle failed: ' + e.message);
  } finally { busy = false; }
}

// ───────── Polling loop ─────────
var treeClosed = {}, treeBusy = false, treeSig = '';
var TREE_TIP = { ok: 'synced', loc: 'local only, uploading', cld: 'cloud only, downloading', diff: 'differs, resolving' };
function fmtSize(n) {
  if (n == null) return '';
  if (n < 1024) return n + ' B';
  if (n < 1048576) return (n / 1024).toFixed(1) + ' KB';
  return (n / 1048576).toFixed(1) + ' MB';
}
function treeNode(n, prefix, parent) {
  Object.keys(n.d).sort().forEach(function (name) {
    var path = prefix + name + '/';
    var det = document.createElement('details');
    var sm = document.createElement('summary');
    det.open = !treeClosed[path];
    det.ontoggle = function () { treeClosed[path] = !det.open; };
    sm.textContent = name;
    det.appendChild(sm);
    treeNode(n.d[name], path, det);
    parent.appendChild(det);
  });
  n.f.forEach(function (f) {
    var row = document.createElement('div');
    var dot = document.createElement('i');
    var nm = document.createElement('span');
    var sz = document.createElement('em');
    row.className = 'tf ' + f.st;
    row.title = f.name + ' · ' + TREE_TIP[f.st];
    nm.textContent = f.name;
    sz.textContent = fmtSize(f.size);
    row.appendChild(dot);
    row.appendChild(nm);
    row.appendChild(sz);
    parent.appendChild(row);
  });
}
async function drawTree(loc, changed) {
  if (treeBusy) return;
  treeBusy = true;
  try {
    var files = {}, rem = remote, lc = loc, k, rm;
    if (changed) {
      rm = (await db('GET', 'meta', undefined, true)) || {};
      rem = {};
      for (k in rm) if (rm[k] && rm[k].path) rem[rm[k].path] = rm[k];
      lc = await localState();
    }
    lc.forEach(function (v, key) { files[key] = { l: v, r: null }; });
    Object.keys(rem).forEach(function (key) {
      if (rem[key].deleted) return;
      if (!files[key]) files[key] = { l: null, r: null };
      files[key].r = rem[key];
    });
    var paths = Object.keys(files).sort(), sig = [], tree = { d: {}, f: [] }, cnt = { ok: 0, pend: 0 };
    paths.forEach(function (path) {
      var f = files[path];
      var st = f.l && f.r ? (f.l.hash === f.r.hash ? 'ok' : 'diff') : (f.l ? 'loc' : 'cld');
      var parts = path.split('/'), name = parts.pop(), n = tree;
      var size = (f.l || f.r).size;
      parts.forEach(function (s) { n = n.d[s] || (n.d[s] = { d: {}, f: [] }); });
      n.f.push({ name: name, st: st, size: size });
      sig.push(path + '|' + st + '|' + size);
      if (st === 'ok') cnt.ok++; else cnt.pend++;
    });
    var sg = (root ? root.name : '') + '#' + sig.join('\n');
    if (sg === treeSig) return;
    treeSig = sg;
    var el = $('tree'), keep = el.scrollTop;
    var head = document.createElement('div');
    el.textContent = '';
    head.className = 'th';
    head.textContent = (root ? root.name : 'Folder') + ' · ' + paths.length + ' files · ' + cnt.ok + ' synced' + (cnt.pend ? ' · ' + cnt.pend + ' pending' : '');
    el.appendChild(head);
    if (!paths.length) {
      var emp = document.createElement('div');
      emp.className = 'te';
      emp.textContent = 'No files yet';
      el.appendChild(emp);
    } else treeNode(tree, '', el);
    el.scrollTop = keep;
  } catch (e) { log('warn', 'file tree refresh failed: ' + e.message); }
  finally { treeBusy = false; }
}
let timer = null, lastTick = 0;
var tickWorker = null;
function startLoop() {
  if (timer) clearInterval(timer);
  if (tickWorker) { tickWorker.terminate(); tickWorker = null; }
  lastTick = Date.now();
  var tick = function () {
    var now = Date.now(), gap = now - lastTick;
    if (gap < POLL_MS - 500) return;
    lastTick = now;
    if (gap > POLL_MS * 3) log('warn', 'poll was delayed ' + Math.round(gap / 1000) + ' s (browser throttles hidden tabs; keep this page visible or in its own window)');
    if (!paused) cycle('auto');
  };
  timer = setInterval(tick, POLL_MS);
  try {
    tickWorker = new Worker(URL.createObjectURL(new Blob(['setInterval(function(){postMessage(1)},' + POLL_MS + ')'], { type: 'text/javascript' })));
    tickWorker.onmessage = tick;
  } catch (e) { tickWorker = null; }
}

// ───────── Folder connect ─────────
async function useFolder(h, fresh) {
  root = h;
  announced = false;
  $('done').style.display = 'none';
  $('bResume').style.display = 'none';
  if (fresh) { base = {}; hcache.clear(); saveBase(); }
  log('ok', 'folder connected: "' + h.name + '"' + (fresh ? ' (new connection, sync history reset)' : ' (restored)'));
  startLoop();
  await cycle('connect');
}
async function pickFolder() {
  if (!window.showDirectoryPicker) { log('err', 'showDirectoryPicker is not available: use desktop Chrome or Edge over https'); return; }
  let h;
  try { h = await window.showDirectoryPicker({ mode: 'readwrite', id: 'extsync' }); }
  catch (e) { log('warn', 'folder picker closed: ' + e.name); return; }
  await idbSet('handle', h);
  await useFolder(h, true);
}
async function setupSysn() {
  if (!window.showDirectoryPicker) { log('err', 'showDirectoryPicker is not available: use desktop Chrome or Edge over https'); return; }
  log('info', 'EXTOS setup: pick where the EXTOS folder should be created (browser will ask for permission)');
  var parent, h, existed = true;
  try { parent = await window.showDirectoryPicker({ mode: 'readwrite', id: 'extsyncparent', startIn: 'documents' }); }
  catch (e) { log('warn', 'SYSN setup cancelled: ' + e.name); return; }
  try {
    if (parent.name === SYSN_NAME) { h = parent; }
    else {
      try { await parent.getDirectoryHandle(SYSN_NAME); } catch (e) { existed = false; }
      h = await parent.getDirectoryHandle(SYSN_NAME, { create: true });
    }
  } catch (e) { log('err', 'could not create ' + SYSN_NAME + ': ' + e.message); return; }
  log('ok', 'permission granted · folder ' + SYSN_NAME + (existed ? ' ready (already existed)' : ' CREATED') + ' inside "' + parent.name + '"');
  await idbSet('handle', h);
  await useFolder(h, true);
  log('ok', 'EXTOS connected: cloud files downloaded, auto-sync running (add/edit/delete syncs both ways)');
}
async function resumeFolder() {
  const h = await idbGet('handle');
  if (!h) return;
  const p = await h.requestPermission({ mode: 'readwrite' });
  log('info', 'folder permission: ' + p);
  if (p === 'granted') await useFolder(h, false);
}

// ───────── Test / diagnostic buttons ─────────
async function pushTest() {
  try {
    const bytes = new TextEncoder().encode(TEST_FILE.text + new Date().toISOString() + '\n');
    const hash = await sha(bytes), key = keyOf(TEST_FILE.path);
    await archiveCloud(TEST_FILE.path, 'before test push').catch(() => {});
    await db('PUT', 'blobs/' + key, b64enc(bytes));
    await db('PUT', 'meta/' + key, { path: TEST_FILE.path, hash, size: bytes.length, mtime: Date.now(), deleted: false, by: 'test-seed' });
    log('ok', 'test file pushed to cloud: ' + TEST_FILE.path + ' (' + short(hash) + ')');
    if (root) cycle('manual');
  } catch (e) { log('err', 'push test failed: ' + e.message); }
}
async function listCloud() {
  try {
    const m = (await db('GET', 'meta')) || {};
    const ks = Object.keys(m);
    log('info', 'cloud has ' + ks.length + ' entries:');
    ks.forEach(k => log('info', '  ' + (m[k].deleted ? '[deleted] ' : '') + m[k].path + '  ' + (m[k].size != null ? m[k].size + ' B  ' : '') + short(m[k].hash) + '  by ' + m[k].by));
  } catch (e) { log('err', 'list failed: ' + e.message); }
}
async function resetCloud() {
  if (!confirm('Delete everything stored under ' + DB_PATH + ' in the cloud (files and history)?')) return;
  try { await db('DELETE', ''); base = {}; saveBase(); log('warn', 'cloud branch ' + DB_PATH + ' cleared'); }
  catch (e) { log('err', 'reset failed: ' + e.message); }
}

// ───────── Wiring ─────────
$('bPick').onclick = pickFolder;
$('bSysn').onclick = setupSysn;
var IS_EDGE = /Edg\//.test(navigator.userAgent);
var KEEP_URL = IS_EDGE ? 'edge://settings/system/optimizePerformance' : 'chrome://settings/performance';
function copyText(t, okMsg) {
  var done = function () { log('ok', okMsg); };
  if (navigator.clipboard) navigator.clipboard.writeText(t).then(done, function () { log('warn', 'copy failed'); });
  else {
    var ta = document.createElement('textarea');
    ta.value = t; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); ta.remove(); done();
  }
}
function keepPrompt() {
  try { if (localStorage.getItem('extsync.keepdone')) return; } catch (e) {}
  $('keepTxt').textContent = 'Keep sync running in the background: open ' + KEEP_URL + ' → ' + (IS_EDGE ? '"Never put these sites to sleep"' : '"Always keep these sites active"') + ' → Add → paste this site.';
  $('keep').style.display = 'flex';
}
$('bKeepSite').onclick = function () { copyText(location.hostname || location.href, 'site address copied: paste it in the browser settings list'); };
$('bKeepLink').onclick = function () { copyText(KEEP_URL, 'settings link copied: paste it in a new tab address bar'); };
$('bKeepX').onclick = function () {
  $('keep').style.display = 'none';
  try { localStorage.setItem('extsync.keepdone', '1'); } catch (e) {}
};
$('bResume').onclick = resumeFolder;
$('bNow').onclick = () => root ? cycle('manual') : log('warn', 'choose a folder first');
$('bPause').onclick = () => {
  paused = !paused;
  $('bPause').textContent = paused ? 'Resume' : 'Pause';
  setStatus(paused ? 'paused' : 'syncing', paused ? 'Paused' : 'Syncing…');
  log('info', paused ? 'auto-sync paused' : 'auto-sync resumed');
  if (!paused) cycle('resume');
};
$('bTest').onclick = pushTest;
$('bList').onclick = listCloud;
$('bReset').onclick = resetCloud;
$('bClear').onclick = () => { lines.length = 0; logEl.textContent = ''; };
$('bCopy').onclick = async () => {
  const text = lines.join('\n');
  try { await navigator.clipboard.writeText(text); log('ok', 'log copied (' + lines.length + ' lines)'); }
  catch (e) {
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); ta.remove();
    log('ok', 'log copied (fallback, ' + lines.length + ' lines)');
  }
};
document.addEventListener('visibilitychange', () => {
  log('net', 'tab ' + document.visibilityState);
  if (document.visibilityState === 'visible') cycle('tab visible');
});
window.addEventListener('error', e => log('err', 'uncaught: ' + e.message));
window.addEventListener('unhandledrejection', e => log('err', 'unhandled: ' + (e.reason && e.reason.message || e.reason)));

// ───────── Startup ─────────
(async function init() {
  log('info', 'Folder Sync v' + VERSION + ' · device ' + DEVICE);
    try { if (navigator.locks) navigator.locks.request('extsync-keepalive', function () { return new Promise(function () {}); }); } catch (e) {}
    keepPrompt();
  log('info', 'browser: ' + navigator.userAgent);
  log('info', 'secure context: ' + window.isSecureContext + ' · folder API: ' + !!window.showDirectoryPicker + ' · crypto: ' + !!(window.crypto && crypto.subtle));
  log('info', 'cloud: ' + DB_URL + '/' + DB_PATH);
  try {
    const m = (await db('GET', 'meta')) || {};
    log('ok', 'cloud reachable, ' + Object.keys(m).length + ' entries');
    setStatus('idle', 'No folder');
  } catch (e) { log('err', 'cloud check failed: ' + e.message); setStatus('error', 'Cloud unreachable'); }
  try {
    const h = await idbGet('handle');
    if (h) {
      const p = await h.queryPermission({ mode: 'readwrite' });
      log('info', 'saved folder "' + h.name + '", permission: ' + p);
      if (p === 'granted') await useFolder(h, false);
      else { $('bResume').style.display = ''; $('bResume').textContent = 'Reconnect "' + h.name + '"'; setStatus('paused', 'Click EXTOS icon to reconnect'); }
    }
  } catch (e) { log('warn', 'could not restore saved folder: ' + e.message); }
})();
</script>
